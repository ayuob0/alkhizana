<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الخزانة — فهرس مكتبتك الشخصية</title><style>body{font-family:"Noto Naskh Arabic","Noto Sans Arabic",Tahoma,sans-serif;max-width:680px;margin:0 auto;padding:24px 18px;line-height:1.9;color:#1c2420;background:#f5f1e8}h1{color:#1f4d3f}</style></head><body><h1>الخزانة</h1><p>تطبيق أندرويد لفهرسة المكتبة الشخصية: تسجّل كتبك وتبحث فيها وتتابع ما تريد شراءه، وتحفظ نسخة احتياطية اختيارية في حسابك على قوقل درايف.</p><p>بيانات كتبك تبقى على جهازك، ولا يجمع التطبيق أي بيانات عنك.</p><p><a href="privacy.html">سياسة الخصوصية</a></p></body></html>
